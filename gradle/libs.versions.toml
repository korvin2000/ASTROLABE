# Explicit pinned versions (TODO P0.1.1). Bump deliberately; every bump is a version boundary (D-02).
[versions]
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
sqlite-jdbc = "3.53.4.0"
slf4j = "2.0.19"
junit = "6.1.3"
jtokkit = "1.1.0"
# P5.4.1 (D-175, D-210): tree-sitter-ng JNI runtime and grammar jars with bundled natives.
tree-sitter-runtime = "0.26.6"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-tsx = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin = "0.3.8.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
tree-sitter-runtime = { module = "io.github.bonede:tree-sitter", version.ref = "tree-sitter-runtime" }
tree-sitter-python = { module = "io.github.bonede:tree-sitter-python", version.ref = "tree-sitter-python" }
tree-sitter-javascript = { module = "io.github.bonede:tree-sitter-javascript", version.ref = "tree-sitter-javascript" }
tree-sitter-typescript = { module = "io.github.bonede:tree-sitter-typescript", version.ref = "tree-sitter-typescript" }
tree-sitter-tsx = { module = "io.github.bonede:tree-sitter-tsx", version.ref = "tree-sitter-tsx" }
tree-sitter-java = { module = "io.github.bonede:tree-sitter-java", version.ref = "tree-sitter-java" }
tree-sitter-kotlin = { module = "io.github.bonede:tree-sitter-kotlin", version.ref = "tree-sitter-kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
