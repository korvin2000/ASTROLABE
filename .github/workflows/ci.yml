# P0.1.2: equal Windows/Linux targets on JDK 26 (D-02, D-12).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      # The junit reporter names each test's file only from Node 24 (Runners.nodeMajor); without
      # the pin a runner's default Node silently skips the ts-small disambiguation fixture.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Without ripgrep the whole search backend-parity suite skips (128 tests on the 2026-09-20
      # run), so the P0.6.3 both-backends criterion would never be exercised on CI.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
        shell: bash
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Toolchain versions used by fixture repos
        run: |
          python --version
          node --version
          git --version
          rg --version
        shell: bash
      # Windows: the hosted runner lost communication under the parallel module test tasks (process spawns failed
      # with 0xC0000142, 2026-09-28); run them one module at a time and log resources each minute to the live log.
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/resource-monitor.ps1 &
            monitor=$!
            status=0
            ./gradlew check --console=plain --no-daemon --no-parallel || status=$?
            touch .resource-monitor.stop
            kill "$monitor" 2>/dev/null || true
            exit $status
          else
            ./gradlew check --console=plain --no-daemon
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
