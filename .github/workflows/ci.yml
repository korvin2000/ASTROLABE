# P0.1.2: equal Windows/Linux targets on JDK 26 (D-02, D-12).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # D-332: `:provider-ai-gate` builds only next to the AI Gate SDK (llm-transport-sdk). A private SDK repository
      # needs the LLM_TRANSPORT_SDK_TOKEN secret; without access this step fails softly and the module is skipped.
      - name: Check out the AI Gate SDK
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: korvin2000/llm-transport-sdk
          path: llm-transport-sdk
          token: ${{ secrets.LLM_TRANSPORT_SDK_TOKEN || github.token }}
      # Beside the repository, where settings.gradle.kts looks by default; the ASTROLABE tree stays clean.
      - name: Place the AI Gate SDK beside the repository
        run: if [ -d llm-transport-sdk ]; then mv llm-transport-sdk ..; fi
        shell: bash
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      # The junit reporter names each test's file only from Node 24 (Runners.nodeMajor); without
      # the pin a runner's default Node silently skips the ts-small disambiguation fixture.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Without ripgrep the whole search backend-parity suite skips (128 tests on the 2026-09-20
      # run), so the P0.6.3 both-backends criterion would never be exercised on CI.
      # On Windows `choco install` exits 0 when its community feed answers 503 ("installed 0/0 packages",
      # CI run 37081275026), so the result is checked here and the pinned GitHub release is the fallback.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress || true
            if ! command -v rg >/dev/null 2>&1; then
              v=15.2.0
              tmp="$(cygpath -u "$RUNNER_TEMP")"
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$tmp/rg.zip"                 "https://github.com/BurntSushi/ripgrep/releases/download/$v/ripgrep-$v-x86_64-pc-windows-msvc.zip"
              unzip -q "$tmp/rg.zip" -d "$tmp/rg"
              export PATH="$tmp/rg/ripgrep-$v-x86_64-pc-windows-msvc:$PATH"
              cygpath -w "$tmp/rg/ripgrep-$v-x86_64-pc-windows-msvc" >> "$GITHUB_PATH"
            fi
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version
        shell: bash
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Toolchain versions used by fixture repos
        run: |
          python --version
          node --version
          git --version
          rg --version
        shell: bash
      - run: ./gradlew check --console=plain --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
